# Builds DeadMansSwitch.exe on Windows and runs its self-test on every push.
# When main carries a VERSION that has no release yet, also tags it vX.Y and
# publishes the GitHub Release the in-app updater looks for.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Two quick pushes must not both try to publish the same version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/DeadMansSwitch/DeadMansSwitch.csproj -c Release -o dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The window's XAML is only parsed at runtime, so build success alone
      # doesn't prove the app starts.
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process dist\DeadMansSwitch.exe -ArgumentList '--selftest' -Wait -PassThru `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt, err.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          $version = (Get-Content VERSION -Raw).Trim()
          & $iscc /Q "/DAppVersion=$version" installer\DeadMansSwitch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Runs the real installer as a user would: installs, checks and uninstalls,
      # then sets up a portable copy and checks that nothing reached Windows.
      - name: Test installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $dir = Join-Path $env:RUNNER_TEMP 'dms-install'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F3C2A51-6B1E-4D7A-9C2E-5A1F0B7D3E44}_is1'
          $exe = Join-Path $dir 'DeadMansSwitch.exe'

          $p = Start-Process "dist\DeadMansSwitch-Setup-$version.exe" -Wait -PassThru `
                 -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir"
          if ($p.ExitCode -ne 0) { throw "Installer exited with code $($p.ExitCode)" }
          if (-not (Test-Path $exe)) { throw "Installer did not create $exe" }
          $shown = (Get-ItemProperty $key).DisplayVersion
          if ($shown -ne $version) { throw "Apps list shows version '$shown', expected $version" }

          $p = Start-Process $exe -ArgumentList '--selftest', '--expect-installed' -Wait -PassThru `
                 -RedirectStandardOutput inst-out.txt -RedirectStandardError inst-err.txt
          Get-Content inst-out.txt, inst-err.txt
          if ($p.ExitCode -ne 0) { throw "The installed app failed its self-test" }

          # The uninstaller hands off to a copy of itself and returns at once, so wait for the result.
          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 30 -and ((Test-Path $exe) -or (Test-Path $key)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "Uninstall left $exe behind" }
          if (Test-Path $key) { throw "Uninstall left the Apps list entry behind" }
          Write-Host "Install mode passed (v$version)."

          $portable = Join-Path $env:RUNNER_TEMP 'dms-portable'
          $p = Start-Process "dist\DeadMansSwitch-Setup-$version.exe" -Wait -PassThru `
                 -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/PORTABLE', "/DIR=$portable"
          if ($p.ExitCode -ne 0) { throw "Portable setup exited with code $($p.ExitCode)" }
          if (-not (Test-Path "$portable\DeadMansSwitch.exe")) { throw "Portable setup did not create the exe" }
          if (-not (Test-Path "$portable\DeadMansSwitch.portable")) { throw "Portable setup did not leave its marker" }
          if (Test-Path "$portable\unins000.exe") { throw "Portable setup added an uninstaller" }
          if (Test-Path $key) { throw "Portable setup added an Apps list entry" }
          $p = Start-Process "$portable\DeadMansSwitch.exe" -ArgumentList '--selftest', '--expect-portable' -Wait -PassThru `
                 -RedirectStandardOutput port-out.txt -RedirectStandardError port-err.txt
          Get-Content port-out.txt, port-err.txt
          if ($p.ExitCode -ne 0) { throw "The portable copy failed its self-test" }
          Write-Host "Portable mode passed (v$version)."

      - uses: actions/upload-artifact@v5
        with:
          name: DeadMansSwitch-Setup
          path: dist/DeadMansSwitch-Setup-*.exe

      # Renders the real window in each state, so UI changes can be reviewed
      # without a Windows machine. Informational only; never blocks a release.
      - name: Screenshots
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process dist\DeadMansSwitch.exe -ArgumentList '--screenshot', 'screenshots' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Screenshot run failed with exit code $($p.ExitCode)" }
          Get-ChildItem screenshots

      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: screenshots
          path: screenshots/

      # Keeps the latest screenshots on the `screenshots` branch (one commit,
      # replaced each time) so the README can show them. Manual runs on other
      # branches go to `screenshots-preview`, to review UI changes before release.
      - name: Publish screenshots
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: pwsh
        run: |
          $target = if ("${{ github.ref }}" -eq 'refs/heads/main') { 'screenshots' } else { 'screenshots-preview' }
          cd screenshots
          git init -q -b screenshots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" `
            commit -q -m "Screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "screenshots:$target"

      - name: Release new version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "v$version is already released."; exit 0 }

          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)"
          if ($text -notmatch $pattern) { throw "CHANGELOG.md has no section for $version." }
          Set-Content -Path release-notes.md -Value $Matches[1].Trim()

          gh release create "v$version" "dist/DeadMansSwitch-Setup-$version.exe" --target "${{ github.sha }}" `
            --title "Dead Man's Switch v$version" --notes-file release-notes.md
