# Builds DeadMansSwitch.exe on Windows and runs its self-test on every push.
# Pushing a vMAJOR.MINOR tag also publishes it as a GitHub Release, which is
# what the in-app updater looks for.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match VERSION ($version)"
          }

      - name: Build
        run: dotnet build src/DeadMansSwitch/DeadMansSwitch.csproj -c Release -o dist

      # The window's XAML is only parsed at runtime, so build success alone
      # doesn't prove the app starts.
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process dist\DeadMansSwitch.exe -ArgumentList '--selftest' -Wait -PassThru `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt, err.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v5
        with:
          name: DeadMansSwitch
          path: dist/DeadMansSwitch.exe

      # Renders the real window in each state, so UI changes can be reviewed
      # without a Windows machine. Informational only; never blocks a release.
      - name: Screenshots
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process dist\DeadMansSwitch.exe -ArgumentList '--screenshot', 'screenshots' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Screenshot run failed with exit code $($p.ExitCode)" }
          Get-ChildItem screenshots

      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: screenshots
          path: screenshots/

      # Keeps the latest screenshots on the `screenshots` branch (one commit,
      # replaced each time) so the README can show them.
      - name: Publish screenshots
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        run: |
          cd screenshots
          git init -q -b screenshots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" `
            commit -q -m "Screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)"
          $notes = if ($text -match $pattern) { $Matches[1].Trim() } else { "Release v$version" }
          Set-Content -Path release-notes.md -Value $notes

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/DeadMansSwitch.exe `
            --title "Dead Man's Switch ${{ github.ref_name }}" --notes-file release-notes.md
